name: Adjudicate publication status B1 remainder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/adjudicate-publication-status-B1-remainder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 22-case remainder adjudication ledger
        run: |
          python - <<'PY'
          import csv, glob
          paths=[
            'data/adjudication_batches/B1_NEURIPS.csv',
            'data/adjudication_batches/B1_ACL_ANTHOLOGY.csv',
            'data/adjudication_batches/B1_CVF.csv',
            'data/adjudication_batches/B1_AAAI_IJCAI.csv',
            'data/adjudication_batches/B1_ACM.csv',
            'data/adjudication_batches/B1_IEEE.csv',
            'data/adjudication_batches/B1_OTHER.csv',
            'data/adjudication_batches/B1_VENUE_BLANK.csv',
          ]
          rows=[]
          for p in paths: rows.extend(csv.DictReader(open(p,encoding='utf-8-sig',newline='')))
          assert len(rows)==22, len(rows)
          decisions={
            439:('RETAIN_ARCHIVAL_OFFICIAL_NEURIPS','Archival published','Advances in Neural Information Processing Systems 36 (NeurIPS 2023)','https://proceedings.neurips.cc/paper_files/paper/2023/hash/6c52a8a4fadc9129c6e1d1745f2dfd0f-Abstract-Conference.html','Official NeurIPS proceedings list the exact Pix2Act paper in the 2023 main conference track.','keep archival published; normalize final title/venue and proceedings identifier'),
            505:('SET_ARCHIVAL_PUBLISHED_FINAL_TITLE','Archival published','Advances in Neural Information Processing Systems 38 (NeurIPS 2025)','https://proceedings.neurips.cc/paper_files/paper/2025/hash/f7c4783621a20f5f11a316cd249e0252-Abstract-Conference.html','Official NeurIPS 2025 proceedings contain the paper under the final title “Thinking vs. Doing: Improving Agent Reasoning by Scaling Test-Time Interaction.”','set archival published; normalize final title/venue and proceedings identifier'),
            57:('RETAIN_ARCHIVAL_OFFICIAL_ACL','Archival published','Proceedings of the 31st International Conference on Computational Linguistics (COLING 2025)','https://aclanthology.org/2025.coling-main.719/','ACL Anthology lists the exact paper in COLING 2025.','keep archival published; retain ACL Anthology identifier'),
            79:('SET_PREPRINT_WRONG_ACL_IDENTIFIER','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2303.09014','The stored ACL DOI 2023.emnlp-main.190 belongs to a different paper (“Evaluating Large Language Models on Controlled Generation Tasks”). DBLP and arXiv list ART only as CoRR/arXiv, so the archival claim is unsupported.','set preprint/technical report; replace incorrect ACL DOI with arXiv identifier'),
            162:('RETAIN_ARCHIVAL_CORRECT_TITLE_IDENTIFIER','Archival published','Proceedings of the 63rd Annual Meeting of the Association for Computational Linguistics (Volume 1: Long Papers)','https://aclanthology.org/2025.acl-long.369/','ACL Anthology lists the final paper as “OS Agents: A Survey on MLLM-based Agents for Computer, Phone and Browser Use,” DOI 10.18653/v1/2025.acl-long.369.','keep archival published; update final title and ACL identifier'),
            761:('SET_PREPRINT_WRONG_ACL_IDENTIFIER','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2503.23434','The stored ACL DOI 2025.findings-acl.1158 belongs to the different paper “GUI Agents: A Survey.” Author/community and DBLP records list “Towards Trustworthy GUI Agents: A Survey” as arXiv/CoRR; no final ACL publication was located.','set preprint/technical report; replace incorrect ACL DOI with arXiv identifier'),
            424:('RETAIN_ARCHIVAL_OFFICIAL_CVF','Archival published','Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR 2026)','https://openaccess.thecvf.com/content/CVPR2026/html/Yu_Ego2Web_A_Web_Agent_Benchmark_Grounded_in_Egocentric_Videos_CVPR_2026_paper.html','Official CVF Open Access proceedings list the exact Ego2Web paper at CVPR 2026.','keep archival published; set official CVF proceedings identifier'),
            548:('RETAIN_ARCHIVAL_OFFICIAL_CVF','Archival published','Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR 2026)','https://openaccess.thecvf.com/content/CVPR2026/papers/Bai_WebGym_Scaling_Training_Environments_for_Long-Horizon_Visual_Web_Agents_with_CVPR_2026_paper.pdf','Official CVPR 2026 proceedings PDF contains WebGym under its final long-horizon title; author page also lists CVPR 2026.','keep archival published; normalize final title/venue and official CVF identifier'),
            189:('RETAIN_ARCHIVAL_OFFICIAL_IJCAI','Archival published','Proceedings of the Thirty-Third International Joint Conference on Artificial Intelligence (IJCAI-24)','https://www.ijcai.org/proceedings/2024/0003','Official IJCAI proceedings list AutoAgents, pages 22–30, DOI 10.24963/ijcai.2024/3.','keep archival published; retain IJCAI DOI'),
            464:('RETAIN_ARCHIVAL_OFFICIAL_IJCAI','Archival published','Proceedings of the Thirty-Third International Joint Conference on Artificial Intelligence (IJCAI-24)','https://www.ijcai.org/proceedings/2024/339','Official IJCAI proceedings list ScreenAI, pages 3058–3068, DOI 10.24963/ijcai.2024/339.','keep archival published; retain IJCAI DOI'),
            214:('RETAIN_ARCHIVAL_ACCEPTED_ACM','Archival accepted','ACM Computing Surveys','https://faculty.cc.gatech.edu/~lingliu/publication.html','Author publication list states “A Survey on Large Language Model Based Game Agents” was accepted by ACM Computing Surveys on May 7, 2026; arXiv v5 also identifies ACM Computing Surveys, 2026. No canonical ACM article DOI was located yet.','keep archival accepted; normalize venue; retain arXiv identifier until ACM DOI is available'),
            372:('RETAIN_ARCHIVAL_CORRECT_TITLE_CVPR','Archival published','Proceedings of the IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR 2024)','https://openaccess.thecvf.com/content/CVPR2024/html/Gao_AssistGUI_Task-Oriented_PC_Graphical_User_Interface_Automation_CVPR_2024_paper.html','Official CVF proceedings list the final title “AssistGUI: Task-Oriented PC Graphical User Interface Automation” at CVPR 2024.','keep archival published; correct title/venue/identifier'),
            169:('SET_PREPRINT_ONLY','Preprint/technical report','Preprints.org','https://www.preprints.org/manuscript/202512.2119','Preprints.org explicitly labels the latest version as a preprint and not peer-reviewed; no later archival publication was located.','set preprint/technical report; set Preprints.org venue/identifier'),
            323:('SET_PREPRINT_ONLY','Preprint/technical report','TechRxiv','https://doi.org/10.36227/techrxiv.175322671.12208812/v1','The available record is a TechRxiv submitted manuscript/preprint; the known-answer control already identified this register archival claim as a false positive.','set preprint/technical report; set TechRxiv identifier'),
            589:('SET_ARCHIVAL_PUBLISHED_AAMAS','Archival published','Proceedings of the 25th International Conference on Autonomous Agents and Multiagent Systems (AAMAS 2026)','https://www.ifaamas.org/Proceedings/aamas2026/forms/contents.htm','Official AAMAS 2026 proceedings contents list “Structured Agent Distillation for Large Language Model Agents”; Crossref also returns proceedings DOI 10.65109/olhj8062.','set archival published; set AAMAS 2026 venue and DOI'),
            771:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2505.12442','Manual search found only the arXiv/CoRR record for IP Leakage Attacks; no authoritative final venue or acceptance record was located.','set preprint/technical report; remove unsupported accepted status'),
            777:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2506.04572','Manual search found arXiv/CoRR plus an anonymous ACL submission, but no evidence of final acceptance/publication.','set preprint/technical report; remove unsupported accepted status'),
            779:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2506.01055','Manual search and DBLP locate only the arXiv/CoRR version; no authoritative final venue or acceptance record was located.','set preprint/technical report; remove unsupported accepted status'),
            783:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2512.20293','Manual search located AprielGuard on arXiv but no authoritative archival venue or final acceptance record.','set preprint/technical report; remove unsupported accepted status'),
            786:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2602.01129','Manual search located SMCP on arXiv but no authoritative archival venue or final acceptance record.','set preprint/technical report; remove unsupported accepted status'),
            788:('SET_PREPRINT_UNDER_REVIEW','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2604.09747','ADAM is on arXiv; the located ICLR 2026 OpenReview manuscript explicitly says “Under review as a conference paper at ICLR 2026,” not accepted/published.','set preprint/technical report; remove unsupported accepted status'),
            789:('SET_PREPRINT_NO_ARCHIVAL_EVIDENCE','Preprint/technical report','arXiv preprint','https://arxiv.org/abs/2604.25562','DBLP classifies SnapGuard as CoRR/informal and manual search found no authoritative final venue or acceptance record.','set preprint/technical report; remove unsupported accepted status'),
          }
          ids={int(r['record_id']) for r in rows}
          assert ids==set(decisions), (sorted(ids-set(decisions)), sorted(set(decisions)-ids))
          out=[]
          for r in rows:
              rid=int(r['record_id']); d,status,venue,evidence,note,action=decisions[rid]
              identifier=evidence
              if rid==589: identifier='https://doi.org/10.65109/olhj8062'
              elif rid==214: identifier=r['register_identifier'] or 'https://arxiv.org/abs/2404.02039'
              out.append({'record_id':rid,'title':r['title'],'machine_verdict':'DOWNGRADE','decision':d,'final_status':status,'final_venue':venue,'final_identifier':identifier,'evidence_url':evidence,'evidence_note':note,'adjudicated_by':'ChatGPT-assisted manual evidence review','adjudicated_at':'2026-09-13','corpus_action':action})
          out.sort(key=lambda x:x['record_id'])
          with open('data/publication_status_manual_adjudication_B1_remainder.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(out[0]));w.writeheader();w.writerows(out)
          print('B1 remainder adjudicated',len(out))
          print('archival',sum(x['final_status'].startswith('Archival') for x in out),'preprint',sum(x['final_status'].startswith('Preprint') for x in out))
          PY
      - name: Commit B1 remainder adjudications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publication_status_manual_adjudication_B1_remainder.csv
          git commit -m "Adjudicate 22 remaining publication downgrade cases" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
