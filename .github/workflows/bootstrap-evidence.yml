name: Bootstrap evidence repository

on:
  push:
    paths:
      - '_upload/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Finalize repository package upload'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and unpack evidence package
        shell: bash
        run: |
          set -euo pipefail
          cat _upload/part_* > /tmp/repository.zip.b64
          base64 --decode /tmp/repository.zip.b64 > /tmp/repository.zip
          rm -rf /tmp/repository_extract
          mkdir -p /tmp/repository_extract
          unzip -q /tmp/repository.zip -d /tmp/repository_extract
          cp -a /tmp/repository_extract/repository_ready/. .
          rm -rf _upload

      - name: Commit repository contents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add survey evidence registers and documentation' || exit 0
          git push
