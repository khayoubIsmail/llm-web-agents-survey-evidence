name: Checkpoint publication status v2 - 43 chunks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkpoint-publication-status-v2-43.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: publication-status-v2-chunk-*
          path: /tmp/chunks
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 34722057696
      - name: Preserve 43 completed chunk outputs
        run: |
          python - <<'PY'
          import csv, glob, json, os, re, shutil
          from datetime import datetime, timezone

          pending = {13, 17, 20, 38, 46}
          source_run = 34722057696
          source_sha = '6f0ce0472abe8ec74e5ba298ed8cebffb67adb16'
          out_dir = 'data/checkpoints/publication_status_v2_run_34722057696_43_chunks'
          os.makedirs(out_dir, exist_ok=True)

          found = []
          for path in glob.glob('/tmp/chunks/out_*.csv'):
              m = re.search(r'out_(\d+)\.csv$', path)
              if not m:
                  continue
              chunk = int(m.group(1))
              if chunk in pending:
                  continue
              found.append((chunk, path))

          found.sort()
          chunks = [c for c, _ in found]
          expected = sorted(set(range(48)) - pending)
          assert chunks == expected, (chunks, expected)
          assert len(found) == 43, len(found)

          merged = []
          fields = None
          for chunk, path in found:
              dst = os.path.join(out_dir, f'out_{chunk}.csv')
              shutil.copyfile(path, dst)
              with open(path, encoding='utf-8-sig', newline='') as f:
                  r = csv.DictReader(f)
                  fields = fields or list(r.fieldnames or [])
                  merged.extend(r)

          merged.sort(key=lambda r: int(r['record_id']))
          ids = [int(r['record_id']) for r in merged]
          assert len(merged) == 722, len(merged)
          assert len(set(ids)) == 722, len(set(ids))

          merged_path = 'data/checkpoints/publication_status_v2_run_34722057696_43_chunks.csv'
          with open(merged_path, 'w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(merged)

          manifest = {
              'status': 'partial_checkpoint_do_not_use_as_final',
              'source_workflow_run_id': source_run,
              'source_workflow_head_sha': source_sha,
              'total_planned_chunks': 48,
              'saved_chunk_count': 43,
              'saved_chunks': chunks,
              'pending_chunks_excluded': sorted(pending),
              'saved_record_count': len(merged),
              'final_expected_record_count': 805,
              'missing_record_count': 805 - len(merged),
              'created_at_utc': datetime.now(timezone.utc).isoformat(),
              'note': 'Permanent checkpoint of the first 43 successful chunk outputs. This is incomplete and must not be treated as the final publication-status verification result.'
          }
          with open('data/checkpoints/publication_status_v2_run_34722057696_43_chunks_manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit permanent partial checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/checkpoints/publication_status_v2_run_34722057696_43_chunks data/checkpoints/publication_status_v2_run_34722057696_43_chunks.csv data/checkpoints/publication_status_v2_run_34722057696_43_chunks_manifest.json
          git commit -m "Checkpoint 43 successful publication-status chunks"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
