name: Extract A3 manual publication checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-publication-status-A3-manual-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract two manual cases
        run: |
          python - <<'PY'
          import csv
          src='data/publication_status_A3_upgrade_triage.csv'
          rows=list(csv.DictReader(open(src,encoding='utf-8-sig',newline='')))
          keep=[r for r in rows if r['triage_bucket']=='A3_MANUAL_WEB_CHECK']
          assert len(keep)==2, len(keep)
          with open('data/publication_status_A3_manual_web_check.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(keep[0]));w.writeheader();w.writerows(keep)
          for r in keep:
              print(r['record_id'],r['title'],r['found_venue'],r['found_doi'])
          PY
      - name: Commit manual cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publication_status_A3_manual_web_check.csv
          git commit -m "Isolate two manual publication upgrade checks" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
