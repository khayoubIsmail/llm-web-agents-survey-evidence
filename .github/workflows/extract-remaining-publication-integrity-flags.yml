name: Extract remaining publication integrity flags

on:
  push:
    paths:
      - '.github/workflows/extract-remaining-publication-integrity-flags.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract non-ICLR flags
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          with open('data/publication_status_adjudication_integrity_flags.csv',encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          rr=[r for r in rows if r['batch']!='B1_ICLR']
          Path('data/publication_status_remaining_integrity_flags.json').write_text(json.dumps(rr,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(rr,indent=2))
          PY
      - name: Commit remaining flags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publication_status_remaining_integrity_flags.json
          git commit -m 'Isolate remaining non-ICLR publication integrity flags'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
