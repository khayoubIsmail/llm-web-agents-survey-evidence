name: Finalize publication status v2.2 from completed 48 chunks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-publication-status-v2-from-run-34722057696.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependency
        run: pip install requests
      - name: Download all 48 completed chunk artifacts from source run
        uses: actions/download-artifact@v4
        with:
          repository: khayoubIsmail/llm-web-agents-survey-evidence
          run-id: 34722057696
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: publication-status-v2-chunk-*
          path: /tmp/chunks
          merge-multiple: true
      - name: Merge 48 outputs, verify corpus identity, and checkpoint raw chunks
        run: |
          python - <<'PY'
          import csv, glob, json, os, shutil
          from pathlib import Path

          files = sorted(glob.glob('/tmp/chunks/out_*.csv'), key=lambda p: int(Path(p).stem.split('_')[1]))
          assert len(files) == 48, f'expected 48 chunk outputs, found {len(files)}: {files}'
          chunk_ids = [int(Path(p).stem.split('_')[1]) for p in files]
          assert chunk_ids == list(range(48)), f'chunk set mismatch: {chunk_ids}'

          rows = []
          fields = None
          per_chunk = {}
          for path in files:
              chunk = int(Path(path).stem.split('_')[1])
              with open(path, encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  this_fields = list(reader.fieldnames or [])
                  if fields is None:
                      fields = this_fields
                  else:
                      assert this_fields == fields, f'field mismatch in chunk {chunk}'
                  chunk_rows = list(reader)
              assert 16 <= len(chunk_rows) <= 17, (chunk, len(chunk_rows))
              per_chunk[chunk] = len(chunk_rows)
              rows.extend(chunk_rows)

          rows.sort(key=lambda r: int(r['record_id']))
          ids = [int(r['record_id']) for r in rows]
          assert len(rows) == 805, len(rows)
          assert len(set(ids)) == 805, len(set(ids))

          corpus_rows = list(csv.DictReader(open('data/studies_805_mapping_corpus.csv', encoding='utf-8-sig')))
          corpus_ids = sorted(int(r['record_id']) for r in corpus_rows)
          assert len(corpus_ids) == 805 and len(set(corpus_ids)) == 805
          assert ids == corpus_ids, f'merged IDs do not equal corpus IDs; missing={sorted(set(corpus_ids)-set(ids))[:20]} extra={sorted(set(ids)-set(corpus_ids))[:20]}'

          final_csv = Path('data/publication_status_verification_v2.csv')
          with final_csv.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows)

          checkpoint = Path('data/checkpoints/publication_status_v2_run_34722057696_48_chunks')
          if checkpoint.exists():
              shutil.rmtree(checkpoint)
          checkpoint.mkdir(parents=True)
          for path in files:
              shutil.copy2(path, checkpoint / Path(path).name)

          manifest = {
              'status': 'complete_raw_checkpoint_48_of_48',
              'source_workflow_run_id': 34722057696,
              'source_workflow_head_sha': '6f0ce0472abe8ec74e5ba298ed8cebffb67adb16',
              'total_planned_chunks': 48,
              'saved_chunk_count': 48,
              'saved_chunks': list(range(48)),
              'saved_record_count': 805,
              'unique_record_count': 805,
              'corpus_record_count': 805,
              'record_id_set_matches_corpus': True,
              'per_chunk_record_counts': {str(k): per_chunk[k] for k in sorted(per_chunk)},
              'note': 'Complete raw machine-verification checkpoint. Final publication-status decisions still require authoritative manual adjudication before corpus membership changes.'
          }
          Path('data/checkpoints/publication_status_v2_run_34722057696_48_chunks_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
      - name: Apply logged authoritative evidence
        run: python scripts/apply_publication_status_manual_evidence.py data/publication_status_verification_v2.csv data/publication_status_manual_evidence.csv
      - name: Known-answer, confidence and title-consistency gates
        run: python scripts/check_publication_status_known_answers.py data/publication_status_verification_v2.csv
      - name: Verify final 805-row identity after manual evidence
        run: |
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open('data/publication_status_verification_v2.csv', encoding='utf-8-sig')))
          corpus = list(csv.DictReader(open('data/studies_805_mapping_corpus.csv', encoding='utf-8-sig')))
          ids = [int(r['record_id']) for r in rows]
          corpus_ids = sorted(int(r['record_id']) for r in corpus)
          assert len(rows) == 805
          assert len(set(ids)) == 805
          assert sorted(ids) == corpus_ids
          print('final identity gate passed: 805 rows / 805 unique corpus record IDs')
          PY
      - name: Build verdict summary
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          rows = list(csv.DictReader(open('data/publication_status_verification_v2.csv', encoding='utf-8-sig')))
          manual = list(csv.DictReader(open('data/publication_status_manual_evidence.csv', encoding='utf-8-sig')))
          c = Counter(r['VERDICT'] for r in rows)
          resolved = sum(v for k, v in c.items() if k != 'NO_MATCH')
          out = {
              'version': 'v2.2',
              'rows': len(rows),
              'unique_record_ids': len({int(r['record_id']) for r in rows}),
              'record_id_set_matches_corpus': True,
              'verdict_counts': dict(sorted(c.items())),
              'resolved': resolved,
              'no_match': c.get('NO_MATCH', 0),
              'known_answer_gate': 'passed',
              'title_consistency_gate': 'passed',
              'confidence_gate': 'passed',
              'manual_authoritative_evidence_records': len(manual),
              'chunks': 48,
              'source_workflow_run_id': 34722057696,
              'source_workflow_head_sha': '6f0ce0472abe8ec74e5ba298ed8cebffb67adb16',
              'raw_checkpoint': 'data/checkpoints/publication_status_v2_run_34722057696_48_chunks',
              'adjudication_status': 'verification_complete_manual_corpus_adjudication_pending'
          }
          open('data/publication_status_verification_v2_summary.json', 'w', encoding='utf-8').write(json.dumps(out, indent=2) + '\n')
          print(json.dumps(out, indent=2))
          PY
      - name: Preserve merged verification cache
        run: |
          rm -rf data/verification_cache_v2
          mkdir -p data/verification_cache_v2
          cp -R /tmp/chunks/cache/. data/verification_cache_v2/
      - name: Commit validated v2.2 verification and complete 48-chunk checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/publication_status_verification_v2.csv \
            data/publication_status_verification_v2_summary.json \
            data/checkpoints/publication_status_v2_run_34722057696_48_chunks \
            data/checkpoints/publication_status_v2_run_34722057696_48_chunks_manifest.json \
            data/verification_cache_v2
          if git diff --cached --quiet; then
            echo "No finalization changes."
            exit 0
          fi
          git commit -m "Finalize validated 805-study publication-status verification v2.2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
