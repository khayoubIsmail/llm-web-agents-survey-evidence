name: G1 system requirement audit

on:
  push:
    paths:
      - 'data/g1_system_requirement_matrix.csv'
      - 'docs/G1_SYSTEM_REQUIREMENT_AUDIT.md'
      - 'docs/G2_OPERATIONAL_DEFINITIONS.md'
      - 'scripts/check_g1_system_requirement_matrix.py'
      - 'data/studies_805_mapping_corpus.csv'
      - 'notes/papers/**'
      - '.github/workflows/g1-system-requirement-audit.yml'
  workflow_dispatch:

jobs:
  validate-g1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate G1 system requirement matrix
        run: python scripts/check_g1_system_requirement_matrix.py
