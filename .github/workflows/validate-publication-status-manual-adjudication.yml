name: Validate publication status manual adjudication

on:
  push:
    paths:
      - '.github/workflows/validate-publication-status-manual-adjudication.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate and validate all 297 ledgers
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          files = [
            ('A1','data/publication_status_manual_adjudication.csv'),
            ('A2_official_proceedings','data/publication_status_manual_adjudication_A2_official_proceedings.csv'),
            ('A2_openreview','data/publication_status_manual_adjudication_A2_openreview.csv'),
            ('A3_upgrades','data/publication_status_manual_adjudication_A3_upgrades.csv'),
            ('B1_ICLR','data/publication_status_manual_adjudication_B1_ICLR.csv'),
            ('B1_PMLR','data/publication_status_manual_adjudication_B1_PMLR.csv'),
            ('B1_COLM','data/publication_status_manual_adjudication_B1_COLM.csv'),
            ('B1_TMLR','data/publication_status_manual_adjudication_B1_TMLR.csv'),
            ('B1_remainder','data/publication_status_manual_adjudication_B1_remainder.csv'),
            ('B2_NO_MATCH','data/publication_status_manual_adjudication_B2_no_match.csv'),
            ('C1_suspicious_OK_PREPRINT','data/publication_status_manual_adjudication_C1_suspicious_preprints.csv'),
          ]
          expected={
            'A1':17,'A2_official_proceedings':13,'A2_openreview':26,'A3_upgrades':58,
            'B1_ICLR':45,'B1_PMLR':15,'B1_COLM':11,'B1_TMLR':8,'B1_remainder':22,
            'B2_NO_MATCH':74,'C1_suspicious_OK_PREPRINT':8,
          }
          with open('data/publication_status_adjudication_queue.csv',encoding='utf-8-sig',newline='') as f:
              queue=list(csv.DictReader(f))
          assert len(queue)==297, len(queue)
          qids={int(r['record_id']) for r in queue}
          assert len(qids)==297, 'duplicate IDs in adjudication queue'
          rows=[]; per={}
          for batch,path in files:
              with open(path,encoding='utf-8-sig',newline='') as f:
                  rr=list(csv.DictReader(f))
              per[batch]=len(rr)
              for r in rr:
                  r=dict(r); r['adjudication_batch']=batch; rows.append(r)
          ids=[int(r['record_id']) for r in rows]
          assert len(ids)==297, len(ids)
          assert len(set(ids))==297, 'duplicate adjudication IDs'
          assert set(ids)==qids, {
              'missing':sorted(qids-set(ids)),
              'extra':sorted(set(ids)-qids),
          }
          assert per==expected, per
          for r in rows:
              for k in ('decision','final_status','evidence_note','corpus_action'):
                  assert (r.get(k) or '').strip(), f"record {r['record_id']} missing {k}"
              assert r['decision']!='PENDING', f"record {r['record_id']} still pending"
          rows.sort(key=lambda r:int(r['record_id']))
          fields=['adjudication_batch']+[k for k in rows[0].keys() if k!='adjudication_batch']
          with open('data/publication_status_manual_adjudication_all.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          machine=Counter(r['machine_verdict'] for r in rows)
          assert machine==Counter({'DOWNGRADE':140,'UPGRADE':58,'VENUE_MISMATCH':15,'VENUE_MISSING':2,'NO_MATCH':74,'OK_PREPRINT':8}), machine
          decisions=Counter(r['decision'] for r in rows)
          finals=Counter(r['final_status'] for r in rows)
          summary={
            'queue_total':len(queue),
            'adjudicated_total':len(rows),
            'remaining_total':0,
            'queue_id_set_exact_match':True,
            'batches':per,
            'machine_verdict_counts_adjudicated':dict(sorted(machine.items())),
            'final_status_counts_adjudicated':dict(sorted(finals.items())),
            'decision_counts':dict(sorted(decisions.items())),
            'next_unreviewed_groups':{},
            'corpus_mutation_status':'not_applied_pending_integrity_audit_and_controlled_corpus_patch',
          }
          open('data/publication_status_manual_adjudication_summary.json','w',encoding='utf-8').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit consolidated ledger and summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/publication_status_manual_adjudication_all.csv data/publication_status_manual_adjudication_summary.json
          git commit -m 'Consolidate all 297 publication-status adjudications'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
