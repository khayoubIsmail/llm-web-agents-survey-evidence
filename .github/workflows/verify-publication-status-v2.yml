name: Verify publication status v2

on:
  workflow_run:
    workflows: ["Publication status v2 known-answer smoke test"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-v2:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Split the 805-row corpus into three deterministic chunks
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('data/studies_805_mapping_corpus.csv',encoding='utf-8-sig')))
          fields=list(rows[0])
          for i in range(3):
              subset=rows[i::3]
              with open(f'/tmp/corpus_{i}.csv','w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(subset)
          assert sum(len(rows[i::3]) for i in range(3)) == 805
          PY
      - name: Cross-check all 805 records with hardened v2.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/verification_cache_v2
          pids=()
          for i in 0 1 2; do
            python scripts/verify_publication_status_v2.py \
              --corpus "/tmp/corpus_${i}.csv" \
              --out "/tmp/out_${i}.csv" \
              --cache "data/verification_cache_v2/chunk_${i}" \
              --sleep 0.35 \
              --email "${{ github.actor }}@users.noreply.github.com" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Merge three outputs and verify row identity
        run: |
          python - <<'PY'
          import csv
          rows=[]; fields=None
          for i in range(3):
              with open(f'/tmp/out_{i}.csv',encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f); fields=fields or list(r.fieldnames or []); rows.extend(r)
          rows.sort(key=lambda r:int(r['record_id']))
          ids=[int(r['record_id']) for r in rows]
          assert len(rows)==805, len(rows)
          assert len(set(ids))==805
          with open('data/publication_status_verification_v2.csv','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          PY
      - name: Apply logged authoritative evidence
        run: python scripts/apply_publication_status_manual_evidence.py data/publication_status_verification_v2.csv data/publication_status_manual_evidence.csv
      - name: Known-answer, confidence and title-consistency gates
        run: python scripts/check_publication_status_known_answers.py data/publication_status_verification_v2.csv
      - name: Build verdict summary
        run: |
          python - <<'PY'
          import csv, json
          from collections import Counter
          rows=list(csv.DictReader(open('data/publication_status_verification_v2.csv', encoding='utf-8-sig')))
          manual=list(csv.DictReader(open('data/publication_status_manual_evidence.csv', encoding='utf-8-sig')))
          c=Counter(r['VERDICT'] for r in rows)
          resolved=sum(v for k,v in c.items() if k!='NO_MATCH')
          out={
              'rows':len(rows),
              'verdict_counts':dict(sorted(c.items())),
              'resolved':resolved,
              'no_match':c.get('NO_MATCH',0),
              'known_answer_gate':'passed',
              'title_consistency_gate':'passed',
              'confidence_gate':'passed',
              'manual_authoritative_evidence_records':len(manual),
          }
          open('data/publication_status_verification_v2_summary.json','w',encoding='utf-8').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Commit v2.2 verification evidence and raw cache
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publication_status_verification_v2.csv data/publication_status_verification_v2_summary.json data/verification_cache_v2
          if git diff --cached --quiet; then
            echo "No v2.2 verification changes."
            exit 0
          fi
          git commit -m "Add validated 805-study publication-status verification v2.2"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
